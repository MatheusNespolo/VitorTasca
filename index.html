<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitor Tasca — Filmmaker & Creative Director</title>
  <meta name="description" content="Portfólio de Vitor Tasca, filmmaker e diretor criativo: restaurantes, videoclipes, eventos, saúde, esportes e institucional.">
  <meta name="theme-color" content="#08080a">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Vitor Tasca — Filmmaker & Creative Director">
  <meta property="og:description" content="Filmmaker especializado em capturar momentos que falam. Veja o portfólio.">
  <meta property="og:image" content="./img/vitor-hero.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="grain">
  <header class="site-header">
    <a class="logo" href="#hero"><span class="logo-name">Vitor Tasca</span><span class="logo-role">Filmmaker &amp; Creative Director</span></a>
    <nav class="nav" aria-label="Principal">
      <a href="#trabalhos">Trabalhos</a>
      <a href="#sobre">Sobre</a>
      <a href="#contato">Contato</a>
      <a class="icon-glow ig-link" data-ig href="#" target="_blank" rel="noopener" aria-label="Instagram">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>
      </a>
    </nav>
  </header>

  <main>
    <section id="hero" class="hero">
      <div class="hero-grid bg-grid" aria-hidden="true"></div>
      <div class="hero-blob" aria-hidden="true"></div>
      <div id="hero-media" class="hero-media"></div>
      <div class="hero-copy">
        <h1 id="hero-name" class="text-glow"></h1>
        <p id="hero-text"></p>
        <div class="hero-actions">
          <button id="btn-showreel" class="btn glow-btn" type="button">Assistir showreel</button>
          <a id="btn-contact" class="btn btn-ghost" href="#contato">Fale comigo</a>
        </div>
      </div>
    </section>

    <section id="trabalhos" class="section">
      <h2>Trabalhos</h2>
      <div id="filters" class="filters" role="group" aria-label="Nichos"></div>
      <p id="niche-desc" class="niche-desc"></p>
      <div id="grid" class="grid" aria-live="polite"></div>
    </section>

    <section id="sobre" class="section about">
      <img id="about-photo" class="about-photo" src="./img/vitor-hero.jpg" alt="Vitor Tasca" loading="lazy">
      <div class="about-body">
        <h2>Sobre</h2>
        <p id="about-text"></p>
        <dl class="stats">
          <div><dt>Anos de experiência</dt><dd id="stat-years"></dd></div>
          <div><dt>Projetos</dt><dd id="stat-projects"></dd></div>
          <div><dt>Nichos</dt><dd id="stat-niches"></dd></div>
        </dl>
      </div>
    </section>

    <section class="section clients-section">
      <h2>Clientes</h2>
      <div class="clients"><div id="clients" class="clients-track"></div></div>
    </section>

    <section id="contato" class="section contact">
      <h2>Vamos criar juntos</h2>
      <div class="contact-actions">
        <a id="contact-wa" class="btn btn-lg glow-btn" href="#" target="_blank" rel="noopener">WhatsApp</a>
        <a id="contact-email" class="btn btn-lg btn-ghost" href="#">E-mail</a>
        <a id="contact-ig" class="btn btn-lg btn-ghost" data-ig href="#" target="_blank" rel="noopener">Instagram</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <span>Vitor Tasca</span> · <span id="year"></span>
  </footer>

  <a id="wa-float" class="wa-float glow-btn" href="#" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
    <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 11.5a8.4 8.4 0 0 1-12.5 7.3L3 20l1.3-5.3A8.4 8.4 0 1 1 21 11.5z"/></svg>
  </a>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
